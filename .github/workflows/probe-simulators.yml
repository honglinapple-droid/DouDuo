name: Probe iPhone simulators

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Inventory
        run: |
          mkdir -p out
          xcodebuild -version | tee out/xcode.txt
          xcrun simctl list runtimes | tee out/runtimes.txt
          xcrun simctl list devices available | tee out/devices.txt
      - name: Dump iPhone Duo device profile
        run: |
          DT="$(xcode-select -p)/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/DeviceTypes"
          ls "$DT" > out/devicetypes.txt
          D="$DT/iPhone Duo.simdevicetype"
          ls -R "$D" | head -50
          for f in profile.plist capabilities.plist; do
            echo "--- $f"; plutil -p "$D/Contents/Resources/$f" | tee -a out/duo-profile.txt
          done
          cp -R "$D/Contents/Resources" out/duo-resources || true
          # 同时抓一台直板机做对照
          plutil -p "$DT/iPhone 17.simdevicetype/Contents/Resources/profile.plist" > out/iphone17-profile.txt || true
      - name: Boot iPhone Duo and screenshot both postures
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in d.items():
              for x in devs:
                  if x["name"]=="iPhone Duo": print(x["udid"]); sys.exit()
          ')
          echo "udid=$UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b; sleep 15
          xcrun simctl io "$UDID" screenshot out/duo-default.png
          echo "=== simctl ui help ==="; xcrun simctl ui "$UDID" 2>&1 | head -60 | tee out/simctl-ui-help.txt
          echo "=== simctl help ==="; xcrun simctl help 2>&1 | grep -iE "fold|posture|orient|rotate|display" | tee -a out/simctl-ui-help.txt
          for a in "posture" "posture folded" "posture unfolded" "fold" "unfold" "display" ; do
            echo ">> $a"; xcrun simctl ui "$UDID" $a 2>&1 | head -5 | tee -a out/simctl-ui-help.txt
            xcrun simctl io "$UDID" screenshot "out/duo-$(echo $a | tr ' ' '-').png" 2>/dev/null || true
          done
          sips -g pixelWidth -g pixelHeight out/*.png | tee out/png-sizes.txt
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-probe
          path: out
          retention-days: 14
